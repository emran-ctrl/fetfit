---
# fetfit — easy-to-digest software, kitchen to table.
# This single file holds the org model: every user and group in the catalog.
# Add new teams and users here; keep the hierarchy parent -> children.
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: fetfit
  description: The fetfit organization
spec:
  type: organization
  profile:
    displayName: fetfit
    email: org@example.com
  children:
    - platform-team
    - sous-chefs
    - guests
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: The team that runs the fetfit IDP, platform and infrastructure
spec:
  type: team
  profile:
    displayName: Platform Team
    email: platform@example.com
  parent: fetfit
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: sous-chefs
  description: Product teams cooking up the services our diners consume
spec:
  type: team
  profile:
    displayName: Sous Chefs
    email: sous-chefs@example.com
  parent: fetfit
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
  description: Guest users; sign-in is only available in development
spec:
  type: team
  profile:
    displayName: Guests
  parent: fetfit
  children: []
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-user
# Guest is only offered as a sign-in option in development; production uses
# GitHub. See app-config.yaml / app-config.production.yaml.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  profile:
    displayName: Guest
  memberOf: [guests]
---
# Starter users; replace the annotations and profile details with the real
# people once they sign in with GitHub. The `github.com/user-id` annotation is
# matched by the auth sign-in resolver (userIdMatchingUserEntityAnnotation) and
# must hold the immutable numeric GitHub user ID.
# https://backstage.io/docs/auth/github/provider#resolvers
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: head-sous-chef
  annotations:
    github.com/user-id: "REPLACE_WITH_GITHUB_USER_ID"
spec:
  profile:
    displayName: Head Sous Chef
    email: chef@example.com
  memberOf: [sous-chefs]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: platform-engineer
  annotations:
    github.com/user-id: "REPLACE_WITH_GITHUB_USER_ID"
spec:
  profile:
    displayName: Platform Engineer
    email: engineer@example.com
  memberOf: [platform-team]
